<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Circle Spectrum" />
  <title>Circle Spectrum</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at center, rgba(45,45,60,.24), rgba(0,0,0,.96) 58%);
      transition: opacity .35s ease;
      z-index: 2;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .panel {
      width: min(420px, 92vw);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 8vw, 48px);
      letter-spacing: -0.045em;
    }

    p {
      color: rgba(255,255,255,.68);
      line-height: 1.45;
      margin: 0 0 24px;
      font-size: 15px;
    }

    button {
      appearance: none;
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.11);
      color: white;
      font: inherit;
      font-weight: 700;
      font-size: 17px;
      border-radius: 999px;
      padding: 15px 24px;
      min-width: 190px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    button:active {
      transform: scale(.97);
    }

    #status {
      margin-top: 16px;
      min-height: 20px;
      font-size: 13px;
      color: rgba(255,255,255,.52);
    }

    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(20px, env(safe-area-inset-bottom));
      text-align: center;
      color: rgba(255,255,255,.3);
      font-size: 12px;
      opacity: 0;
      transition: opacity .5s ease 1.2s;
      pointer-events: none;
      z-index: 1;
    }

    #hint.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <canvas id="viz"></canvas>

  <div id="overlay">
    <div class="panel">
      <h1>Circle Spectrum</h1>
      <p>
        Tap start, allow microphone access, then play music or make some noise.
        Everything stays on your device.
      </p>
      <button id="start">Start Visualizer</button>
      <div id="status"></div>
    </div>
  </div>

  <div id="hint">Tap anywhere to toggle fullscreen-style controls</div>

  <script>
    const canvas = document.getElementById("viz");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("start");
    const overlay = document.getElementById("overlay");
    const statusEl = document.getElementById("status");
    const hint = document.getElementById("hint");

    let audioContext;
    let analyser;
    let dataArray;
    let stream;
    let running = false;
    let smoothed = [];

    const BAR_COUNT = 96;
    const FFT_SIZE = 2048;
    const SMOOTHING = 0.82;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    addEventListener("resize", resize, { passive: true });
    resize();

    async function startVisualizer() {
      try {
        statusEl.textContent = "Requesting microphone…";

        stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          },
          video: false
        });

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioCtx();

        if (audioContext.state === "suspended") {
          await audioContext.resume();
        }

        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = FFT_SIZE;
        analyser.smoothingTimeConstant = 0.72;
        analyser.minDecibels = -95;
        analyser.maxDecibels = -15;

        source.connect(analyser);

        dataArray = new Uint8Array(analyser.frequencyBinCount);
        smoothed = new Array(BAR_COUNT).fill(0);

        running = true;
        overlay.classList.add("hidden");
        hint.classList.add("show");
        requestAnimationFrame(draw);
      } catch (err) {
        console.error(err);
        if (err.name === "NotAllowedError") {
          statusEl.textContent = "Microphone permission was denied.";
        } else if (!navigator.mediaDevices?.getUserMedia) {
          statusEl.textContent = "Microphone access is unavailable here. Use HTTPS in Safari.";
        } else {
          statusEl.textContent = "Couldn’t start the microphone: " + err.message;
        }
      }
    }

    startBtn.addEventListener("click", startVisualizer);

    function frequencyValueForBar(index) {
      // Logarithmic-ish spacing: more visual detail in bass/mids.
      const minBin = 2;
      const maxBin = Math.min(dataArray.length - 1, 700);

      const t1 = index / BAR_COUNT;
      const t2 = (index + 1) / BAR_COUNT;

      const start = Math.floor(minBin * Math.pow(maxBin / minBin, t1));
      const end = Math.max(
        start + 1,
        Math.floor(minBin * Math.pow(maxBin / minBin, t2))
      );

      let sum = 0;
      let peak = 0;
      let count = 0;

      for (let i = start; i < end && i < dataArray.length; i++) {
        const v = dataArray[i] / 255;
        sum += v;
        peak = Math.max(peak, v);
        count++;
      }

      const avg = count ? sum / count : 0;
      // Peak gives punch; average keeps it stable.
      return Math.min(1, avg * 0.72 + peak * 0.48);
    }

    function draw() {
      if (!running) return;

      analyser.getByteFrequencyData(dataArray);

      const w = innerWidth;
      const h = innerHeight;
      const cx = w / 2;
      const cy = h / 2;

      ctx.clearRect(0, 0, w, h);

      // Very subtle vignette.
      const bg = ctx.createRadialGradient(
        cx, cy, 0,
        cx, cy, Math.max(w, h) * 0.65
      );
      bg.addColorStop(0, "rgba(18,18,28,1)");
      bg.addColorStop(0.52, "rgba(4,4,8,1)");
      bg.addColorStop(1, "rgba(0,0,0,1)");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      const radius = Math.min(w, h) * 0.19;
      const maxBar = Math.min(w, h) * 0.27;
      const lineWidth = Math.max(2.2, Math.min(w, h) * 0.006);

      // Soft center halo.
      const halo = ctx.createRadialGradient(
        cx, cy, radius * 0.2,
        cx, cy, radius * 1.65
      );
      halo.addColorStop(0, "rgba(255,255,255,.055)");
      halo.addColorStop(0.58, "rgba(150,160,255,.028)");
      halo.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 1.7, 0, Math.PI * 2);
      ctx.fill();

      // Inner ring.
      ctx.strokeStyle = "rgba(255,255,255,.18)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.stroke();

      for (let i = 0; i < BAR_COUNT; i++) {
        const raw = frequencyValueForBar(i);

        // Dynamic boost. Keeps quiet audio visible without destroying punch.
        let target = Math.pow(raw, 1.35);
        target = Math.max(0.02, target);

        smoothed[i] =
          smoothed[i] * SMOOTHING +
          target * (1 - SMOOTHING);

        const angle = (i / BAR_COUNT) * Math.PI * 2 - Math.PI / 2;
        const barLength = 4 + smoothed[i] * maxBar;

        const x1 = cx + Math.cos(angle) * (radius + 4);
        const y1 = cy + Math.sin(angle) * (radius + 4);
        const x2 = cx + Math.cos(angle) * (radius + 4 + barLength);
        const y2 = cy + Math.sin(angle) * (radius + 4 + barLength);

        // Hue walks around the circle.
        const hue = (i / BAR_COUNT) * 320 + 190;
        const lightness = 62 + smoothed[i] * 18;

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineWidth = lineWidth;

        // Glow.
        ctx.shadowBlur = 10 + smoothed[i] * 18;
        ctx.shadowColor = `hsla(${hue}, 100%, 65%, .75)`;
        ctx.strokeStyle = `hsla(${hue}, 100%, ${lightness}%, .96)`;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.restore();
      }

      requestAnimationFrame(draw);
    }

    // Hide/show the tiny helper text after start.
    document.addEventListener("click", (e) => {
      if (running && e.target !== startBtn) {
        hint.classList.toggle("show");
      }
    });
  </script>
</body>
</html>
